# pnpm refuses to run a dependency's install scripts unless the decision is
# recorded here, and it fails the whole install rather than warning. Both of
# these ship prebuilt native binaries; their scripts only select the right one
# for the platform.
allowBuilds:
  esbuild: true
  unrs-resolver: true

# Published inside the registry policy's minimum-release-age window when these
# versions were pinned. Excluding them keeps the install reproducible instead of
# blocked on a clock.
minimumReleaseAgeExclude:
  - "@next/eslint-plugin-next@16.3.2"
  - eslint-config-next@16.3.2
  - maplibre-gl@6.5.0
