name: matcher

# The continuous half of the notification story.
#
# The application has no server of its own that is awake between requests: the
# parcel queries run in the visitor's browser and the API is a set of serverless
# functions. So something outside has to decide when to look, and this is it.
#
# The pass runs HERE rather than calling the deployment, because a workflow
# runner can use native DuckDB. That range reads the published parquet - a few
# hundred kilobytes per query against a 50 MB artifact - where a serverless
# function cannot carry the 70 MB shared library at all. It writes to the same
# store and goes through the same evaluateAndAlert as a pass started from the
# app, so the alerts are indistinguishable.
#
# GitHub Actions rather than a platform cron because the Vercel Hobby plan
# allows one cron invocation per day, and one a day is not a notification
# service. Actions minutes are unmetered on a public repository.

on:
  schedule:
    # Every 30 minutes. The pipeline publishes every six hours, so most passes
    # find nothing new - which is the point: the evidence table records them, so
    # "nothing arrived last night" has an answer.
    - cron: "*/30 * * * *"
  workflow_dispatch:
    inputs:
      reason:
        description: Why this pass is being run by hand
        required: false
        default: manual
      ref:
        description: Which ref to check out and run. Defaults to MATCHER_REF, then this workflow's own ref.
        required: false
        default: ""

permissions:
  # The CRM store is a branch of this repository, so the pass writes documents
  # with the run's own token. That is the whole credential story for the
  # schedule: nothing to rotate, nothing to leak, and the scope ends when the
  # run does.
  contents: write

concurrency:
  # A pass that is still running must not be raced by the next scheduled one.
  group: matcher
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # The CRM store. These are the deployment's values, so a scheduled pass
      # and a pass started from the app write to the same documents.
      CRM_STORE_REPO: ${{ vars.CRM_STORE_REPO }}
      CRM_STORE_BRANCH: ${{ vars.CRM_STORE_BRANCH }}
      CRM_STORE_ROOT: ${{ vars.CRM_STORE_ROOT }}
      # The run's own token. Set the CRM_STORE_TOKEN secret instead when the
      # store lives in a different repository from this workflow.
      CRM_STORE_TOKEN: ${{ secrets.CRM_STORE_TOKEN || secrets.GITHUB_TOKEN }}
      CRM_STORE_AUTHOR_NAME: matcher (scheduled)
      # Set this instead to use the Postgres backend.
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      PROPERTY_DATA_URL: ${{ vars.PROPERTY_DATA_URL }}
      RUN_HISTORY_URL: ${{ vars.RUN_HISTORY_URL }}
      # What the evidence record says about itself.
      #
      # `matcher-runs` is the document a reviewer reads to answer "did the
      # schedule run, over what, and what did it find". It used to hardcode
      # `trigger: cron`, so a pass dispatched by hand was recorded as a scheduled
      # one, and nothing anywhere named the commit that produced it. Three rounds
      # of pre-fix code ran on this schedule against the live store before anyone
      # noticed, which is exactly the failure a record that cannot name its own
      # generation permits.
      #
      # `GITHUB_EVENT_NAME` is set by Actions and is what the runner reads to
      # decide cron versus manual. `MATCHER_REASON` carries the dispatcher's own
      # words - the `reason` input, which was declared here and consumed by
      # nothing. `MATCHER_COMMIT_SHA` and `MATCHER_COMMIT_REF` are filled in
      # below, after checkout, because the code that RAN is not always the code
      # that triggered the run.
      MATCHER_REASON: ${{ inputs.reason }}
      # Native DuckDB is available here, unlike on the serverless runtime.
      PROPERTY_ENGINE: native
      # Pull the artifact down once rather than range reading it. The public
      # gateway times out under hundreds of range requests: a pass that did it
      # that way answered "Timeout was reached" for every search after thirteen
      # minutes. This is the default under CI anyway; stated here because it is
      # the difference between a working schedule and a red one.
      PROPERTY_FETCH_WHOLE: "1"
    steps:
      # Explicit rather than implicit. Without a `ref` this checks out whatever
      # ref started the run, which for `on: schedule` is always the default
      # branch's copy of this file - a GitHub constraint that cannot be worked
      # around and is not being worked around here. What CAN be fixed is the
      # silence: a dispatched pass can now name the ref it wants, a repository
      # variable can pin the schedule to a ref other than the default, and the
      # resolved commit is echoed into the summary and written onto the run
      # document, so "which code produced this record" has an answer.
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || vars.MATCHER_REF || github.ref }}

      - name: Name the code that is about to run
        # actions/checkout has no sha output, and GITHUB_SHA names the commit
        # that TRIGGERED the run rather than the one checked out. Asking git is
        # the only answer that is true in both cases.
        #
        # The two expressions arrive as environment variables rather than being
        # interpolated into the script. `inputs.ref` is a string a dispatcher
        # chooses, and a `${{ }}` inside a `run:` block is pasted into the shell
        # before the shell sees it, which is the standard Actions injection
        # shape. As env values they are data.
        env:
          REQUESTED_REF: ${{ inputs.ref || vars.MATCHER_REF || github.ref }}
          TRIGGERING_EVENT: ${{ github.event_name }}
        run: |
          SHA="$(git rev-parse HEAD)"
          echo "MATCHER_COMMIT_SHA=$SHA" >> "$GITHUB_ENV"
          echo "MATCHER_COMMIT_REF=$REQUESTED_REF" >> "$GITHUB_ENV"
          {
            echo "### matcher"
            echo
            echo "| field | value |"
            echo "| --- | --- |"
            echo "| event | \`$TRIGGERING_EVENT\` |"
            echo "| requested ref | \`$REQUESTED_REF\` |"
            echo "| resolved commit | \`$SHA\` |"
            echo
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Check the configuration is present
        # Fail loudly rather than run against an in-process store, which would
        # report a green pass that evaluated nothing and alerted nobody.
        run: |
          if [ -z "$CRM_STORE_REPO" ] && [ -z "$DATABASE_URL" ]; then
            echo "No CRM store is configured. Set the CRM_STORE_* repository variables and the CRM_STORE_TOKEN secret, or DATABASE_URL for Postgres." >&2
            exit 1
          fi
          if [ -n "$CRM_STORE_REPO" ] && [ -z "$CRM_STORE_TOKEN" ]; then
            echo "CRM_STORE_REPO is set but no token reached the job; the store would be read only and the pass could raise no alerts." >&2
            exit 1
          fi
          if [ -z "$PROPERTY_DATA_URL" ]; then
            echo "PROPERTY_DATA_URL is not set as a repository variable; the pass would evaluate the bundled sample." >&2
            exit 1
          fi

      - name: Run the matcher
        run: pnpm matcher
